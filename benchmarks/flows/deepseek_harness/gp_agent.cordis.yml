# DeepSeek Harness composition for the iEDA GP MCP plugin.
#
# The model sees ONLY the mcp__gp__* tools, so every placement action goes
# through the same verified gp_agent.py / run_ipl_full_compare.py CLIs.
# Add persistent bash / editor entries here if you also want repo-level work.

- id: sdk-jsonrpc-server
  name: '@deepseek-ai/dsh-sdk-jsonrpc-server'
  config:
    maxTokensAsSuccess: false

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    apiKeyEnv: DEEPSEEK_API_KEY
    streamIdleTimeoutMs: 172800000
    models:
      - id: !!js process.env.DSH_MODEL ?? 'deepseek-v4-flash'
        contextWindow: !!js Number(process.env.DSH_CONTEXT_WINDOW ?? 1000000)

- id: sandbox
  name: '@deepseek-ai/dsh-sandbox-local'

- id: sandbox-policy
  name: '@deepseek-ai/dsh-sandbox-policy'
  config:
    mode: danger-full-access
    workspaceRoot: !!js process.env.DSH_CWD ?? process.cwd()

- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

- id: mcp-gp
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    transport: stdio
    serverName: gp
    command: python3
    args:
      - !!js (process.env.IEDA_ROOT ?? '/home/lizhijun/work/iEDA.ai') + '/benchmarks/flows/deepseek_harness/gp_mcp_server.py'
    env:
      IEDA_ROOT: !!js process.env.IEDA_ROOT ?? '/home/lizhijun/work/iEDA.ai'
    cwd: !!js process.env.IEDA_ROOT ?? '/home/lizhijun/work/iEDA.ai'
    toolCallTimeoutMs: 7200000
    failOnStartupError: true

- id: agent-spine
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    includeHarnessIdentity: false
    includeRuntimeContext: false
    persona: !!js process.env.DSH_SYSTEM_PROMPT ??
      'You are an EDA placement engineer. Drive the iEDA GP plugin to minimize HPWL and beat the Innovus baselines. Always compare candidate metrics before accepting a stage.'
    workspaceContext: false
    skills:
      enabled: false
    toolBash: false
    toolJobs: false

- id: sessions
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js process.env.DSH_SESSION_ROOT ?? './.sessions'
    compression: none
