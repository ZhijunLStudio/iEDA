# iEDA GP bundle patch. A dsh profile bundle must ship this file and declare it
# under `dsh.bundle.patch`; `dsh plugin --profile <name> add` then reconciles
# the package into the profile's bundle list automatically.
- insert:
    - id: ipl-tools
      name: '@ieda-ai/dsh-tool-ipl'
      config:
        iedaRoot: !!js process.env.IEDA_ROOT
        python: !!js process.env.IEDA_PYTHON ?? 'python3'
        timeoutMs: 7200000
