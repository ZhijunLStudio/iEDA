# Native-plugin DeepSeek Harness composition for iEDA GP.
#
# This composition mounts @deepseek-ai/dsh-tool-ieda-gp directly. The model
# sees the first-party tools ieda_gp_* registered on ctx.tools; no MCP bridge
# is involved. Keep the JSON-RPC serving entry so the Python SDK can drive it.

- id: sdk-jsonrpc-server
  name: '@deepseek-ai/dsh-sdk-jsonrpc-server'
  config:
    maxTokensAsSuccess: false

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    apiKeyEnv: DEEPSEEK_API_KEY
    streamIdleTimeoutMs: 172800000
    models:
      - id: !!js process.env.DSH_MODEL ?? 'deepseek-v4-flash'
        contextWindow: !!js Number(process.env.DSH_CONTEXT_WINDOW ?? 1000000)

- id: ieda-gp
  name: '@deepseek-ai/dsh-tool-ieda-gp'
  config:
    iedaRoot: !!js process.env.IEDA_ROOT ?? '/home/lizhijun/work/iEDA.ai'
    python: python3
    timeoutMs: 7200000

- id: sandbox
  name: '@deepseek-ai/dsh-sandbox-local'

- id: sandbox-policy
  name: '@deepseek-ai/dsh-sandbox-policy'
  config:
    mode: danger-full-access
    workspaceRoot: !!js process.env.DSH_CWD ?? process.cwd()

- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

- id: agent-spine
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    includeHarnessIdentity: false
    includeRuntimeContext: false
    persona: !!js process.env.DSH_SYSTEM_PROMPT ??
      'You are an EDA placement engineer. Drive the iEDA GP tools to minimize HPWL and beat the Innovus baselines.'
    workspaceContext: false
    skills:
      enabled: false
    toolBash: false
    toolJobs: false

- id: sessions
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js process.env.DSH_SESSION_ROOT ?? './.sessions'
    compression: none
